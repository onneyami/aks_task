apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellofromdotnet-deployment
  labels:
    environment: dev
    app: hellofromdotnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellofromdotnet
  template:
    metadata:
      labels:
        app: hellofromdotnet
    spec:
      nodeSelector:
        "kubernetes.io/os": windows
      containers:
      - name: hellofromdotnet
        image: newregistryaplvodti8.azurecr.io/hellofromdotnet:v1.0
        resources:
          limits:
            cpu: "1"
            memory: 800M
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hellofromdotnet-service
spec:
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
  selector:
    app: hellofromdotnet
